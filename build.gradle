import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id "org.jetbrains.kotlin.jvm" version "2.3.0"
}

version = project.mod_version + "+" + project.primary_mc_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        url = "https://maven.operationpotato.com/mirror"
    }

    maven {
        url = "https://maven.azureaaron.net/releases"
        content {
            includeGroup("net.azureaaron")
        }
    }

    maven {
        url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
        content {
            includeGroup("me.djtheredstoner")
        }
    }

    flatDir {
        dir "libs"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    include implementation("net.azureaaron:hm-api:${project.hm_api_version}")
    runtimeOnly("me.djtheredstoner:DevAuth-fabric:${project.dev_auth_version}")
}

tasks.processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.property("loader_version")
    inputs.property "mc_range", project.property("mc_range")
    inputs.property "fabric_kotlin_version", project.property("fabric_kotlin_version")

    filesMatching("fabric.mod.json") {
        expand(
                "version": inputs.properties["version"],
                "loader_version": inputs.properties["loader_version"],
                "minecraft_version": inputs.properties["mc_range"],
                "fabric_kotlin_version": inputs.properties["fabric_kotlin_version"],
                "java_version": 25
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

tasks.withType(KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_25
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    //    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}
